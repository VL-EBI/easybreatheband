<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBB Analytics</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- On easybreatheband.com this file supplies the analytics service address; when served by the service itself it is not needed. -->
<script src="js/ebb-config.js"></script>
<style>
/* Internal dashboard: warm neutrals from the EBB palette, system fonts (no outside requests). */
:root{--bg:#F6F1E8;--card:#FFFDF8;--ink:#2A211B;--muted:#6E6052;--line:#E4D9C8;--accent:#B8643A;--accent-2:#56604B;--bar:#C78B4C;--bar-soft:#EBD9BF;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#1C1814;--card:#271F19;--ink:#F2E5CF;--muted:#BBAA90;--line:#3D3128;--accent:#E08A5B;--accent-2:#9AA88A;--bar:#D9A066;--bar-soft:#4A3A2D;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left)) 64px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
h1{margin:0;font:700 26px/1.2 Georgia,"Times New Roman",serif}
h1 small{display:block;font:500 13px/1.4 system-ui,sans-serif;color:var(--muted);margin-top:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,.btn{min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.btn{text-decoration:none;font-weight:600;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi.hl{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font:700 28px/1.1 Georgia,serif;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{margin:0 0 4px;font:700 17px/1.3 Georgia,serif}
.card p.note{margin:0 0 12px;color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
td.wr{white-space:normal;min-width:160px}
.empty{color:var(--muted);padding:12px 0}
.meter{position:relative;height:8px;border-radius:4px;background:var(--bar-soft);min-width:80px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--bar)}
svg text{fill:var(--muted);font-size:11px}
.funnel{display:flex;flex-direction:column;gap:10px}
.fstep{display:grid;grid-template-columns:200px minmax(0,1fr) 110px;gap:12px;align-items:center}
.fstep .meter{height:22px}
.fstep b{font-variant-numeric:tabular-nums;text-align:right}
.map-wrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
.map{position:relative;width:100%;aspect-ratio:1/3;max-height:900px;border:1px solid var(--line);border-radius:6px;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%)}
.map i{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--accent);opacity:.35}
.map span{position:absolute;right:6px;font-size:11px;color:var(--muted)}
.err{padding:16px;border-radius:8px;background:#F6D9CF;color:#5A1E0C}
.gate{max-width:420px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
.gate h1{margin-bottom:6px}
.gate p{margin:0 0 18px;color:var(--muted)}
.gate form{display:flex;flex-direction:column;gap:10px}
.gate label{font-weight:600}
.gate input{min-height:46px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.gate button,.btn-solid{min-height:46px;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.gate .msg{min-height:22px;margin:0;color:#B3401F;font-size:14px}
[hidden]{display:none!important}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.hl{grid-column:1/-1}.grid{grid-template-columns:minmax(0,1fr)}.map-wrap{grid-template-columns:minmax(0,1fr)}.map{max-width:300px}.fstep{grid-template-columns:120px minmax(0,1fr) 90px}}
</style>
</head>
<body>
<div class="wrap">
<section class="gate" id="gate" aria-labelledby="gate-title">
<h1 id="gate-title">EBB analytics</h1>
<p>Enter the access code to see the numbers.</p>
<form id="gate-form">
<label for="code">Access code</label>
<input id="code" type="password" autocomplete="current-password" required>
<button type="submit" id="unlock">Unlock</button>
<p class="msg" id="gate-msg" aria-live="polite"></p>
</form>
</section>
<div id="dash" hidden>
<header>
<h1>EBB analytics<small id="range-note">Loading…</small></h1>
<div class="controls">
<label for="days" style="font-size:13px;color:var(--muted)">Period</label>
<select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last 12 months</option></select>
<button type="button" class="btn" id="csv">Download CSV</button>
<button type="button" class="btn" id="lock">Lock</button>
</div>
</header>
<div id="app"></div>
</div>
</div>
<script>
// Where the numbers come from: the analytics service. On easybreatheband.com/analytics the address is in js/ebb-config.js;
// when this page is served by the service itself, it uses the same address.
const API = ((window.EBB_CONFIG && window.EBB_CONFIG.analyticsEndpoint) || '').replace(/\/$/, '');
const CODE_KEY = 'ebb-dash-code';
let code = '';
try { code = sessionStorage.getItem(CODE_KEY) || ''; } catch (e) {}
const api = (path) => fetch(API + path, { headers: { 'X-EBB-Code': code }, cache: 'no-store' });
const SONGS = {
  'a-little-pressure': 'A Little Pressure', 'leave-it-on': 'Leave It On', 'nothing-to-hide': 'Nothing to Hide',
  'tomorrow-comes-in-a-box': 'Tomorrow Comes in a Box', 'stay-for-the-leftovers': 'Stay for the Leftovers',
  'heres-to-the-quiet-ones': 'Here’s to the Quiet Ones', 'keep-the-good': 'Keep the Good'
};
const PAGES = { '/': 'Home', '/music': 'Music', '/band': 'Meet the Band', '/about': 'About', '/contact': 'Contact', '/thanksgiving': 'Thanksgiving', '/404': 'Not found' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = (v) => Number(v || 0).toLocaleString();
const pct = (a, b) => b ? Math.round((a / b) * 100) : 0;
const page = (p) => esc(PAGES[p] || p);
const meter = (v) => `<div class="meter" role="img" aria-label="${v}%"><i style="width:${Math.max(0, Math.min(100, v))}%"></i></div>`;
const table = (cols, rows) => rows.length
  ? `<div class="scroll"><table><thead><tr>${cols.map((c) => `<th class="${c.num ? 'num' : ''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td class="${c.num ? 'num' : ''} ${c.wrap ? 'wr' : ''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
  : '<p class="empty">No data yet for this period.</p>';

// Sort Easy Breathe click-throughs into the three destinations (the test link and the store link share an address, so the button text decides).
function ebTypes(rows) {
  const out = { 'Insurance check': 0, 'Home sleep test': 0, 'Easy Breathe store and other links': 0 };
  rows.forEach((r) => {
    const k = /insurance\./.test(r.href) ? 'Insurance check' : /sleep test|\$150|tested/i.test(r.label || '') ? 'Home sleep test' : 'Easy Breathe store and other links';
    out[k] += r.visits;
  });
  return Object.entries(out);
}

function dailyChart(daily, days) {
  const map = Object.fromEntries(daily.map((d) => [d.day, d]));
  const pts = [];
  for (let i = days - 1; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); pts.push({ day: d, v: (map[d] || {}).visits || 0 }); }
  const W = 1000, H = 180, pad = 24, max = Math.max(1, ...pts.map((p) => p.v));
  const bw = (W - pad) / pts.length;
  const bars = pts.map((p, i) => { const h = (p.v / max) * (H - 30); return `<rect x="${pad + i * bw + 1}" y="${H - 18 - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="2" fill="var(--bar)"><title>${p.day}: ${p.v} visits</title></rect>`; }).join('');
  const lbl = (i) => `<text x="${pad + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${pts[i].day.slice(5)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Visits per day"><text x="0" y="12">${max}</text><line x1="${pad}" x2="${W}" y1="${H - 18}" y2="${H - 18}" stroke="var(--line)"/>${bars}${lbl(0)}${lbl(Math.floor(pts.length / 2))}${lbl(pts.length - 1)}</svg>`;
}

let lastPage;
async function load(pageSel) {
  if (pageSel !== undefined) lastPage = pageSel;
  pageSel = lastPage;
  const days = document.getElementById('days').value;
  const app = document.getElementById('app');
  let d;
  try {
    const r = await api('/api/summary?days=' + days + (pageSel ? '&page=' + encodeURIComponent(pageSel) : ''));
    if (r.status === 401 || r.status === 429 || r.status === 503) { lock(await r.text()); return; }
    if (!r.ok) throw new Error('The server answered ' + r.status + '.');
    d = await r.json();
  } catch (e) { app.innerHTML = `<p class="err">Couldn’t load the numbers. ${esc(e.message)} Refresh the page to try again.</p>`; return; }
  document.getElementById('range-note').textContent = 'Visitors who allowed analytics · since ' + d.since + ' (UTC) · updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ', refreshes every minute';
  const t = d.totals, f = d.funnel_thanksgiving;
  const scroll = Object.fromEntries(d.scroll.map((s) => [s.path, s]));
  const exits = Object.fromEntries(d.exits.map((x) => [x.path, x]));
  app.innerHTML = `
  <section class="kpis" aria-label="Totals">
    <div class="kpi"><b>${n(t.visits)}</b><span>Visits</span></div>
    <div class="kpi"><b>${n(t.pageviews)}</b><span>Page views</span></div>
    <div class="kpi"><b>${n(t.song_plays)}</b><span>Song plays</span></div>
    <div class="kpi"><b>${n(t.clicks)}</b><span>Clicks</span></div>
    <div class="kpi hl"><b>${n(t.eb_visits)}</b><span>Went to Easy Breathe · ${pct(t.eb_visits, t.visits)}% of visits</span></div>
  </section>
  <div class="grid">
    <section class="card wide"><h2>Visits per day</h2><p class="note">A visit is one browser tab session, which can include several pages.</p>${dailyChart(d.daily, d.days)}</section>

    <section class="card wide"><h2>Going to Easy Breathe</h2><p class="note">Clicks that took visitors to an Easy Breathe site: the insurance check, the home sleep test, or the Easy Breathe store. ${n(t.eb_visits)} visits (${pct(t.eb_visits, t.visits)}%) clicked through at least once.</p>
      <div class="funnel" style="margin-bottom:14px">
        ${ebTypes(d.easybreathe).map(([l, v]) => `<div class="fstep"><span>${esc(l)}</span>${meter(pct(v, t.eb_visits))}<b>${n(v)} visits</b></div>`).join('')}
      </div>
      <div class="grid" style="gap:16px">
        <div>${table([{ h: 'Button or link', wrap: 1, f: (r) => esc(r.label || '(no label)') }, { h: 'Goes to', wrap: 1, f: (r) => esc(r.href) }, { h: 'Clicks', num: 1, f: (r) => n(r.clicks) }], d.easybreathe)}</div>
        <div>${table([{ h: 'Clicked from page', f: (r) => page(r.path) }, { h: 'Visits', num: 1, f: (r) => n(r.visits) }, { h: 'Clicks', num: 1, f: (r) => n(r.clicks) }], d.easybreathe_pages)}</div>
      </div></section>

    <section class="card wide"><h2>Thanksgiving: from visit to Easy Breathe</h2><p class="note">Visits to /thanksgiving, how many played a song there, and how many of those then went to Easy Breathe (insurance check, home sleep test or store) in the same visit. ${n(f.easybreathe_any)} Thanksgiving visits went to Easy Breathe in total, with or without playing a song.</p>
      <div class="funnel">
        ${[['Visited the page', f.visited], ['Played a song', f.played], ['Went to Easy Breathe', f.easybreathe]].map(([l, v]) => `<div class="fstep"><span>${l}</span>${meter(pct(v, f.visited))}<b>${n(v)} · ${pct(v, f.visited)}%</b></div>`).join('')}
      </div></section>

    <section class="card wide"><h2>Songs</h2><p class="note">Plays include resuming after a pause. “Finished” and the listening marks are shares of fresh starts.</p>
      ${table([
        { h: 'Song', f: (r) => esc(SONGS[r.song] || r.song) },
        { h: 'Plays', num: 1, f: (r) => n(r.plays) },
        { h: 'Listeners', num: 1, f: (r) => n(r.listeners) },
        { h: 'Heard 25%', num: 1, f: (r) => pct(r.p25, r.starts) + '%' },
        { h: 'Heard 50%', num: 1, f: (r) => pct(r.p50, r.starts) + '%' },
        { h: 'Heard 75%', num: 1, f: (r) => pct(r.p75, r.starts) + '%' },
        { h: 'Finished', num: 1, f: (r) => pct(r.finished, r.starts) + '%' },
        { h: '', f: (r) => meter(pct(r.finished, r.starts)) }
      ], d.songs)}</section>

    <section class="card wide"><h2>Pages and drop-off</h2><p class="note">How far down people scrolled, how long the page was in view, and how often it was the last page of a visit.</p>
      ${table([
        { h: 'Page', f: (r) => page(r.path) },
        { h: 'Views', num: 1, f: (r) => n(r.pageviews) },
        { h: 'Visits', num: 1, f: (r) => n(r.visits) },
        { h: 'Avg time', num: 1, f: (r) => r.avg_seconds == null ? '—' : Math.floor(r.avg_seconds / 60) + ':' + String(r.avg_seconds % 60).padStart(2, '0') },
        { h: 'Reached 25%', num: 1, f: (r) => pct((scroll[r.path] || {}).d25, (scroll[r.path] || {}).views) + '%' },
        { h: '50%', num: 1, f: (r) => pct((scroll[r.path] || {}).d50, (scroll[r.path] || {}).views) + '%' },
        { h: '75%', num: 1, f: (r) => pct((scroll[r.path] || {}).d75, (scroll[r.path] || {}).views) + '%' },
        { h: 'Bottom', num: 1, f: (r) => pct((scroll[r.path] || {}).d100, (scroll[r.path] || {}).views) + '%' },
        { h: 'Left from here', num: 1, f: (r) => ((exits[r.path] || {}).exit_rate || 0) + '%' }
      ], d.pages)}</section>

    <section class="card"><h2>Where visits came from</h2><p class="note">“Direct” includes people who typed the address they heard on hold.</p>
      ${table([{ h: 'Source', wrap: 1, f: (r) => esc(r.source) }, { h: 'Visits', num: 1, f: (r) => n(r.visits) }], d.sources)}</section>

    <section class="card"><h2>Landing pages and devices</h2><p class="note">The first page of each visit, then visits by screen size.</p>
      ${table([{ h: 'First page', f: (r) => page(r.path) }, { h: 'Visits', num: 1, f: (r) => n(r.visits) }], d.entries)}
      ${table([{ h: 'Device', f: (r) => esc(r.device) }, { h: 'Visits', num: 1, f: (r) => n(r.visits) }], d.devices)}</section>

    <section class="card wide"><h2>Most-clicked links and buttons</h2>
      ${table([
        { h: 'Page', f: (r) => page(r.path) },
        { h: 'Clicked', wrap: 1, f: (r) => esc(r.label || '(no label)') },
        { h: 'Goes to', wrap: 1, f: (r) => esc(r.href || '—') },
        { h: 'Section', f: (r) => esc(r.area || '') },
        { h: 'Clicks', num: 1, f: (r) => n(r.clicks) }
      ], d.clicks)}</section>

    <section class="card wide"><h2>Click map</h2><p class="note">Each dot is a click, placed by its position across and down the whole page. Lines mark quarters of the page. Phone and desktop layouts differ, so compare one device at a time.</p>
      <div class="map-wrap">
        <div>
          <div class="controls" style="margin-bottom:12px">
            <label for="map-page" style="font-size:13px;color:var(--muted)">Page</label>
            <select id="map-page">${d.pages.map((p) => `<option value="${esc(p.path)}" ${p.path === d.clickmap.path ? 'selected' : ''}>${page(p.path)}</option>`).join('')}</select>
            <select id="map-vw" aria-label="Device"><option value="">All devices</option><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="mobile">Phone</option></select>
          </div>
          <div class="map" id="map" role="img" aria-label="Click positions on ${page(d.clickmap.path)}"></div>
        </div>
        <div id="map-top"></div>
      </div></section>
  </div>`;
  const drawMap = () => {
    const vw = document.getElementById('map-vw').value;
    const pts = d.clickmap.points.filter((p) => !vw || p.vw === vw);
    document.getElementById('map').innerHTML = ['Top', '25%', '50%', '75%'].map((l, i) => `<span style="top:calc(${i * 25}% + 2px)">${l}</span>`).join('') +
      pts.map((p) => `<i style="left:${p.x}%;top:${p.y}%" title="${esc(p.label)}"></i>`).join('');
    const counts = {};
    pts.forEach((p) => { counts[p.label] = (counts[p.label] || 0) + 1; });
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 12);
    document.getElementById('map-top').innerHTML = `<h2 style="font:700 15px Georgia,serif;margin:0 0 6px">Top clicks on this page</h2>` +
      table([{ h: 'Clicked', wrap: 1, f: (r) => esc(r[0] || '(no label)') }, { h: 'Clicks', num: 1, f: (r) => n(r[1]) }], top);
  };
  document.getElementById('map-vw').onchange = drawMap;
  document.getElementById('map-page').onchange = (e) => load(e.target.value);
  const vwSel = document.getElementById('map-vw'); if (window.__mapVw) { vwSel.value = window.__mapVw; } vwSel.addEventListener('change', () => { window.__mapVw = vwSel.value; });
  drawMap();
}
function lock(message) {
  code = '';
  try { sessionStorage.removeItem(CODE_KEY); } catch (e) {}
  document.getElementById('dash').hidden = true;
  document.getElementById('gate').hidden = false;
  document.getElementById('gate-msg').textContent = message || '';
  document.getElementById('code').value = '';
  document.getElementById('code').focus();
}
async function unlock(candidate) {
  const msg = document.getElementById('gate-msg');
  const isServedByService = location.pathname.replace(/\/$/, '').endsWith('/dashboard');
  if (!API && !isServedByService) { msg.textContent = 'Analytics isn’t connected yet. Add the service address to js/ebb-config.js.'; return; }
  msg.textContent = 'Checking…';
  code = candidate;
  let r;
  try { r = await api('/api/summary?days=1'); } catch (e) { msg.textContent = 'Couldn’t reach the analytics service. Check your connection and try again.'; return; }
  if (!r.ok) { lock(r.status === 401 ? 'That code didn’t work.' : await r.text()); return; }
  try { sessionStorage.setItem(CODE_KEY, code); } catch (e) {}
  msg.textContent = '';
  document.getElementById('gate').hidden = true;
  document.getElementById('dash').hidden = false;
  load();
}
document.getElementById('gate-form').onsubmit = (e) => { e.preventDefault(); unlock(document.getElementById('code').value.trim()); };
document.getElementById('lock').onclick = () => lock('Locked.');
document.getElementById('days').onchange = () => load();
document.getElementById('csv').onclick = async () => {
  const days = document.getElementById('days').value;
  const r = await api('/export.csv?days=' + days);
  if (!r.ok) { lock(r.status === 401 ? 'That code didn’t work.' : await r.text()); return; }
  const url = URL.createObjectURL(await r.blob());
  const a = document.createElement('a');
  a.href = url; a.download = 'ebb-analytics-last-' + days + '-days.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
};
if (code) unlock(code); else document.getElementById('code').focus();
// Keep the numbers fresh while the dashboard is open and visible.
setInterval(() => { if (!document.hidden && !document.getElementById('dash').hidden) load(); }, 60000);
</script>
</body>
</html>
